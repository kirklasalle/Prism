<div class="tab-grid">
    <section class="rail-section panel full-width-panel">
        <div
            class="rail-header clickable-header"
            data-collapse-target="networkTools"
            data-tip-id="network:tools"
            data-tip-kind="network"
        >
            <h3>📡 Network Tools</h3>
            <span id="networkTools-collapse-icon" class="collapse-icon">▼</span>
        </div>
        <div id="networkTools-collapsible" class="collapsible-body">
            <div id="network-tools-panel" class="stack"></div>
        </div>
    </section>

    <section class="rail-section panel full-width-panel">
        <div
            class="rail-header clickable-header"
            data-collapse-target="networkSettings"
            data-tip-id="network:settings"
            data-tip-kind="network"
        >
            <h3>⚙️ Network Settings</h3>
            <span id="networkSettings-collapse-icon" class="collapse-icon">▼</span>
        </div>
        <div id="networkSettings-collapsible" class="collapsible-body">
            <div id="network-settings-panel" class="stack"></div>
        </div>
    </section>

    <section class="rail-section panel full-width-panel">
        <div
            class="rail-header clickable-header"
            data-collapse-target="networkTelemetry"
            data-tip-id="network:telemetry"
            data-tip-kind="network"
        >
            <h3>📊 Network Telemetry</h3>
            <span id="networkTelemetry-collapse-icon" class="collapse-icon">▼</span>
        </div>
        <div id="networkTelemetry-collapsible" class="collapsible-body">
            <div id="network-telemetry-panel" class="stack"></div>
        </div>
    </section>

    <section class="rail-section panel full-width-panel">
        <div
            class="rail-header clickable-header"
            data-collapse-target="networkConsole"
            data-tip-id="network:console"
            data-tip-kind="network"
        >
            <h3>🖥️ Network Console</h3>
            <span id="networkConsole-collapse-icon" class="collapse-icon">▼</span>
        </div>
        <div id="networkConsole-collapsible" class="collapsible-body">
            <div class="console-input-row">
                <input
                    id="network-console-input"
                    type="text"
                    placeholder="Enter network command (e.g. ipconfig, ping 8.8.8.8)"
                    class="channels-input"
                />
                <button id="network-console-run-btn" class="primary-button">▶ Run</button>
                <button id="network-console-clear-btn" class="network-clear-btn">Clear Output</button>
            </div>
            <pre id="network-console-output" class="network-console-box">Ready — enter a network command above.</pre>
            <div id="network-history-list"></div>
        </div>
    </section>

    <section class="rail-section panel full-width-panel intelligence-panel">
        <div
            class="rail-header clickable-header"
            data-collapse-target="networkIntelligence"
            data-tip-id="network:vrgc"
            data-tip-kind="network"
        >
            <h3>🧠 Network Intelligence (VRGC)</h3>
            <span id="networkIntelligence-collapse-icon" class="collapse-icon">▼</span>
        </div>
        <div id="networkIntelligence-collapsible" class="collapsible-body">
            <div id="network-intelligence-panel" class="stack">
                <div class="muted text-center-padded">Loading VRGC status…</div>
            </div>
        </div>
    </section>
</div>
