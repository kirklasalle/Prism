<div class="tab-grid">
    <section class="rail-section panel" style="grid-column: 1/-1">
        <div class="sched-top-bar">
            <div class="sched-top-left">
                <h3 class="sched-main-title">📅 Scheduler</h3>
                <span id="sched-loading-indicator" class="sched-loading-pill" style="display: none">
                    <span class="sched-loading-dot"></span> Loading…
                </span>
            </div>
            <div class="sched-top-actions">
                <button
                    class="primary-button sched-action-btn"
                    data-tip-id="scheduler:add-event"
                    data-tip-kind="scheduler"
                    onclick="openSchedulerModal('event')"
                >
                    + Event
                </button>
                <button
                    class="primary-button sched-action-btn"
                    data-tip-id="scheduler:add-task"
                    data-tip-kind="scheduler"
                    onclick="openSchedulerModal('task')"
                >
                    + Task
                </button>
                <button
                    class="primary-button sched-action-btn"
                    data-tip-id="scheduler:add-project"
                    data-tip-kind="scheduler"
                    onclick="openSchedulerModal('project')"
                >
                    + Project
                </button>
                <button
                    class="primary-button sched-action-btn"
                    data-tip-id="scheduler:add-cron"
                    data-tip-kind="scheduler"
                    onclick="openSchedulerModal('cron')"
                >
                    + Cron Job
                </button>
                <button class="secondary-button sched-action-btn" onclick="refreshSchedulerData()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Sub-navigation tabs -->
        <div class="sched-subnav">
            <button
                class="sched-subnav-btn active"
                data-sched-view="calendar"
                data-tip-id="scheduler:view-calendar"
                data-tip-kind="scheduler"
                onclick="switchSchedulerView('calendar')"
            >
                📅 Calendar
            </button>
            <button
                class="sched-subnav-btn"
                data-sched-view="projects"
                data-tip-id="scheduler:view-projects"
                data-tip-kind="scheduler"
                onclick="switchSchedulerView('projects')"
            >
                📋 Projects
            </button>
            <button
                class="sched-subnav-btn"
                data-sched-view="board"
                data-tip-id="scheduler:view-board"
                data-tip-kind="scheduler"
                onclick="switchSchedulerView('board')"
            >
                📌 Board
            </button>
            <button
                class="sched-subnav-btn"
                data-sched-view="timeline"
                data-tip-id="scheduler:view-timeline"
                data-tip-kind="scheduler"
                onclick="switchSchedulerView('timeline')"
            >
                📊 Timeline
            </button>
            <button
                class="sched-subnav-btn"
                data-sched-view="cron"
                data-tip-id="scheduler:view-cron"
                data-tip-kind="scheduler"
                onclick="switchSchedulerView('cron')"
            >
                ⏰ Cron Jobs
            </button>
        </div>

        <!-- Calendar View -->
        <div id="sched-view-calendar" class="sched-view-panel">
            <div class="sched-cal-toolbar">
                <div class="sched-cal-nav">
                    <button class="secondary-button sched-nav-btn" onclick="schedCalNav(-1)">‹</button>
                    <span id="sched-cal-title" class="sched-cal-title-text"></span>
                    <button class="secondary-button sched-nav-btn" onclick="schedCalNav(1)">›</button>
                </div>
                <div class="sched-cal-modes">
                    <button class="sched-mode-btn" data-cal-mode="year" onclick="setCalMode('year')">Year</button>
                    <button class="sched-mode-btn" data-cal-mode="month" onclick="setCalMode('month')">Month</button>
                    <button class="sched-mode-btn" data-cal-mode="week" onclick="setCalMode('week')">Week</button>
                    <button class="sched-mode-btn active" data-cal-mode="day" onclick="setCalMode('day')">Day</button>
                </div>
            </div>
            <div id="sched-cal-body" class="sched-cal-body"></div>
        </div>

        <!-- Projects View -->
        <div id="sched-view-projects" class="sched-view-panel" style="display: none">
            <div id="sched-projects-list" class="stack"></div>
        </div>

        <!-- Board (Kanban) View -->
        <div id="sched-view-board" class="sched-view-panel" style="display: none">
            <div class="sched-kanban-board">
                <div data-status="backlog" class="sched-kanban-column">
                    <div class="sched-kanban-column-title">Backlog</div>
                    <div id="sched-lane-backlog" class="sched-lane-body sched-kanban-lane"></div>
                </div>
                <div data-status="todo" class="sched-kanban-column">
                    <div class="sched-kanban-column-title">To Do</div>
                    <div id="sched-lane-todo" class="sched-lane-body sched-kanban-lane"></div>
                </div>
                <div data-status="in-progress" class="sched-kanban-column">
                    <div class="sched-kanban-column-title">In Progress</div>
                    <div id="sched-lane-in-progress" class="sched-lane-body sched-kanban-lane"></div>
                </div>
                <div data-status="review" class="sched-kanban-column">
                    <div class="sched-kanban-column-title">Review</div>
                    <div id="sched-lane-review" class="sched-lane-body sched-kanban-lane"></div>
                </div>
                <div data-status="done" class="sched-kanban-column">
                    <div class="sched-kanban-column-title">Done</div>
                    <div id="sched-lane-done" class="sched-lane-body sched-kanban-lane"></div>
                </div>
            </div>
        </div>

        <!-- Timeline (Gantt) View -->
        <div id="sched-view-timeline" class="sched-view-panel" style="display: none">
            <div class="sched-gantt-toolbar">
                <button class="secondary-button sched-nav-btn" onclick="ganttNav(-1)">‹</button>
                <span id="sched-gantt-range-label" class="sched-cal-title-text"></span>
                <button class="secondary-button sched-nav-btn" onclick="ganttNav(1)">›</button>
            </div>
            <div id="sched-gantt-header" class="sched-gantt-header"></div>
            <div id="sched-gantt-rows" class="sched-gantt-rows-container"></div>
        </div>

        <!-- Cron Jobs View -->
        <div id="sched-view-cron" class="sched-view-panel" style="display: none">
            <div class="sched-cron-toolbar">
                <button class="primary-button sched-action-btn" onclick="openSchedulerModal('cron')">
                    + New Cron Job
                </button>
                <button class="secondary-button sched-action-btn" onclick="refreshCronJobs()">🔄 Refresh</button>
                <span id="sched-cron-count" class="muted sched-cron-count"></span>
            </div>
            <div id="sched-cron-list" class="stack"></div>
        </div>
    </section>
</div>
